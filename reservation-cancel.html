<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Skucha - Anulowanie rezerwacji</title>
  <style>
    :root { --bg: #f5f4f1; --card: #fffdf9; --ink: #1a1916; --muted: #6b6862; --line: #dfddd7; --accent: #fb5a12; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; color: var(--ink); background: var(--bg); font-family: "Segoe UI", sans-serif; }
    main { width: min(620px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); box-shadow: 0 24px 60px -40px rgba(0, 0, 0, 0.45); }
    .eyebrow { color: var(--accent); font: 700 12px/1.2 Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 20px 0 0; font-size: clamp(32px, 7vw, 52px); line-height: 1; letter-spacing: -.04em; }
    p { color: var(--muted); line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    button, a { min-height: 44px; padding: 11px 16px; border-radius: 10px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { border: 1px solid var(--accent); color: #fff; background: var(--accent); }
    button:disabled { opacity: .6; cursor: wait; }
    a { border: 1px solid var(--line); color: var(--ink); background: #fff; }
    .status { min-height: 24px; margin-top: 20px; color: var(--muted); }
    .status.error { color: #b42318; }
    .status.ok { color: #1f8a5b; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">SKUCHA / REZERWACJA</div>
    <h1>Anulować rezerwację?</h1>
    <p>Potwierdź poniżej. Jeśli płatność została pobrana, zlecimy zwrot przez Stripe.</p>
    <div class="actions">
      <button id="cancelButton" type="button">Anuluj rezerwację</button>
      <a href="/">Wróć na stronę</a>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var reservationId = params.get("reservation_id") || "";
      var token = params.get("token") || "";
      var button = document.getElementById("cancelButton");
      var status = document.getElementById("status");

      function setStatus(message, kind) {
        status.textContent = message;
        status.className = "status" + (kind ? " " + kind : "");
      }

      if (!reservationId || !token) {
        button.disabled = true;
        setStatus("Link anulowania jest niekompletny.", "error");
        return;
      }

      button.addEventListener("click", function () {
        button.disabled = true;
        setStatus("Przetwarzamy anulowanie i ewentualny zwrot...");

        fetch("/api/reservation/cancel", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ reservationId: reservationId, token: token })
        })
          .then(function (response) {
            return response.json().then(function (payload) {
              return { ok: response.ok, payload: payload };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              throw new Error(result.payload.message || "Nie udało się anulować rezerwacji.");
            }

            setStatus("Rezerwacja została anulowana. Status zwrotu: " + (result.payload.paymentStatus || "nie dotyczy") + ".", "ok");
          })
          .catch(function (error) {
            button.disabled = false;
            setStatus(error.message || "Nie udało się anulować rezerwacji.", "error");
          });
      });
    })();
  </script>
</body>
</html>
