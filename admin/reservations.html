<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Skucha - Reservations</title>
  <style>
    :root { --bg: #f5f4f1; --card: #fffdf9; --ink: #1a1916; --muted: #6b6862; --line: #dfddd7; --accent: #fb5a12; --ok: #1f8a5b; --error: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); font-family: "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--line); background: var(--card); }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); letter-spacing: -.04em; }
    header a { color: var(--muted); font-weight: 700; }
    main { width: min(1180px, calc(100% - 32px)); margin: 28px auto 60px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    button, select { min-height: 40px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); font: inherit; font-weight: 700; }
    button { cursor: pointer; }
    button.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .status { min-height: 24px; margin-bottom: 14px; color: var(--muted); }
    .status.error { color: var(--error); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    table { width: 100%; border-collapse: collapse; min-width: 920px; }
    th, td { padding: 13px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .actions-cell { vertical-align: middle; white-space: nowrap; }
    .actions-cell button { min-height: 34px; padding: 7px 9px; font-size: 13px; }
    #activeFilter[aria-pressed="true"] { border-color: var(--ok); color: #fff; background: var(--ok); }
    #activeFilter[aria-pressed="true"]:hover { border-color: #176b46; background: #176b46; }
    .empty { padding: 30px; color: var(--muted); text-align: center; }
    .blackout-panel { margin-bottom: 24px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .blackout-panel h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .blackout-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; align-items: end; gap: 10px; margin-top: 16px; }
    .field { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    input { min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fff; font: inherit; }
    .blackout-status { min-height: 22px; margin-top: 12px; color: var(--muted); }
    .blackout-status.error { color: var(--error); }
    .blackout-list { overflow-x: auto; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; }
    .blackout-list table { min-width: 560px; }
    .blackout-list td, .blackout-list th { padding: 10px 12px; }
    .blackout-list .actions-cell { text-align: right; }
    .blackout-list .actions-cell button { min-height: 32px; padding: 6px 9px; }
    @media (max-width: 760px) { .blackout-form { grid-template-columns: repeat(2, minmax(0, 1fr)); } .blackout-form button { grid-column: 1 / -1; } }
    @media (max-width: 620px) { header { align-items: flex-start; flex-direction: column; } main { width: min(100% - 20px, 1180px); margin-top: 16px; } .blackout-form { grid-template-columns: 1fr; } .blackout-form button { grid-column: auto; } }
  </style>
</head>
<body>
  <header>
    <h1>Reservations</h1>
    <a href="/.auth/logout">Sign out</a>
  </header>
  <main>
    <section class="blackout-panel" aria-labelledby="blackoutHeading">
      <h2 id="blackoutHeading">Blocked rental dates</h2>
      <form id="blackoutForm" class="blackout-form">
        <label class="field" for="blackoutFrom">From <input id="blackoutFrom" type="date" required></label>
        <label class="field" for="blackoutTo">To <input id="blackoutTo" type="date" required></label>
        <label class="field" for="blackoutReason">Reason <input id="blackoutReason" type="text" maxlength="200" placeholder="Optional"></label>
        <button class="primary" type="submit">Block dates</button>
      </form>
      <div id="blackoutStatus" class="blackout-status" role="status" aria-live="polite"></div>
      <div class="blackout-list">
        <table>
          <thead><tr><th>Dates</th><th>Reason</th><th>Actions</th></tr></thead>
          <tbody id="blackoutsBody"><tr><td class="empty" colspan="3">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
    <div class="toolbar">
      <select id="statusFilter" aria-label="Status filter">
        <option value="">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="InProgress">In progress</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
        <option value="Expired">Expired</option>
      </select>
      <button id="activeFilter" type="button" aria-pressed="false">Active only</button>
      <button id="refreshButton" class="primary" type="button">Refresh</button>
      <button id="housekeepingButton" type="button">Run housekeeping</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Customer</th><th>Dates</th><th>Inventory</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead>
        <tbody id="reservationsBody"><tr><td class="empty" colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>
  <script>
    (function () {
      var body = document.getElementById("reservationsBody");
      var status = document.getElementById("status");
      var statusFilter = document.getElementById("statusFilter");
      var activeFilter = document.getElementById("activeFilter");
      var blackoutForm = document.getElementById("blackoutForm");
      var blackoutFrom = document.getElementById("blackoutFrom");
      var blackoutTo = document.getElementById("blackoutTo");
      var blackoutReason = document.getElementById("blackoutReason");
      var blackoutStatus = document.getElementById("blackoutStatus");
      var blackoutsBody = document.getElementById("blackoutsBody");
      var activeOnly = false;

      function setStatus(message, isError) {
        status.textContent = message || "";
        status.className = "status" + (isError ? " error" : "");
      }

      function setBlackoutStatus(message, isError) {
        blackoutStatus.textContent = message || "";
        blackoutStatus.className = "blackout-status" + (isError ? " error" : "");
      }

      function readApiResponse(response) {
        return response.text().then(function (raw) {
          var payload = {};

          if (raw) {
            try {
              payload = JSON.parse(raw);
            } catch (_error) {
              payload = { message: raw.slice(0, 240) };
            }
          }

          if (!payload.message) {
            if (response.status === 401) {
              payload.message = "Admin sign-in is required. Sign in again and reload this page.";
            } else if (response.status === 403) {
              payload.message = "Your account does not have the admin role.";
            } else if (response.status === 404) {
              payload.message = "The admin API is not available in this preview deployment.";
            } else {
              payload.message = "Admin API returned HTTP " + response.status + ".";
            }
          }

          return { ok: response.ok, status: response.status, payload: payload };
        });
      }

      function render(reservations) {
        body.innerHTML = "";
        if (!reservations.length) {
          body.innerHTML = '<tr><td class="empty" colspan="6">No reservations found.</td></tr>';
          return;
        }

        reservations.forEach(function (reservation) {
          var row = document.createElement("tr");
          var customer = document.createElement("td");
          var customerName = document.createElement("strong");
          customerName.textContent = reservation.customerName || "-";
          var customerMeta = document.createElement("div");
          customerMeta.className = "meta";
          customerMeta.appendChild(document.createTextNode(reservation.customerEmail || "-"));
          customerMeta.appendChild(document.createElement("br"));
          customerMeta.appendChild(document.createTextNode(reservation.customerPhone || "-"));
          customer.appendChild(customerName);
          customer.appendChild(customerMeta);
          var dates = document.createElement("td");
          dates.appendChild(document.createTextNode(reservation.fromDate || "-"));
          dates.appendChild(document.createElement("br"));
          dates.appendChild(document.createTextNode(reservation.toDate || "-"));
          var dateMeta = document.createElement("div");
          dateMeta.className = "meta";
          dateMeta.textContent = reservation.pickupPoint || reservation.deliveryMethod || "-";
          dates.appendChild(dateMeta);
          var inventory = document.createElement("td");
          inventory.textContent = String(reservation.pads || 0) + " pad(s)";
          var lifecycle = document.createElement("td");
          lifecycle.textContent = reservation.status;
          var payment = document.createElement("td");
          payment.textContent = reservation.paymentStatus || "-";
          var actions = document.createElement("td");
          actions.className = "actions-cell";

          if (reservation.status === "Confirmed") {
            var collect = document.createElement("button");
            collect.textContent = "Mark collected";
            collect.addEventListener("click", function () { collectReservation(reservation); });
            actions.appendChild(collect);
          }
          if (reservation.status === "InProgress") {
            var complete = document.createElement("button");
            complete.textContent = "Mark returned";
            complete.addEventListener("click", function () { completeReservation(reservation); });
            actions.appendChild(complete);
          }
          if (!actions.childNodes.length) { actions.textContent = "-"; }

          row.appendChild(customer); row.appendChild(dates); row.appendChild(inventory); row.appendChild(lifecycle); row.appendChild(payment); row.appendChild(actions);
          body.appendChild(row);
        });
      }

      function renderBlackouts(blackouts) {
        blackoutsBody.innerHTML = "";
        if (!blackouts.length) {
          blackoutsBody.innerHTML = '<tr><td class="empty" colspan="3">No blocked dates.</td></tr>';
          return;
        }

        blackouts.forEach(function (blackout) {
          var row = document.createElement("tr");
          var dates = document.createElement("td");
          dates.textContent = blackout.fromDate + " - " + blackout.toDate;
          var reason = document.createElement("td");
          reason.textContent = blackout.reason || "-";
          var actions = document.createElement("td");
          actions.className = "actions-cell";
          var remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Remove";
          remove.addEventListener("click", function () { removeBlackout(blackout); });
          actions.appendChild(remove);
          row.appendChild(dates);
          row.appendChild(reason);
          row.appendChild(actions);
          blackoutsBody.appendChild(row);
        });
      }

      function loadBlackouts() {
        setBlackoutStatus("Loading...");
        fetch("/api/backoffice/availability", { credentials: "same-origin", headers: { Accept: "application/json" } })
          .then(readApiResponse)
          .then(function (result) {
            if (!result.ok) { throw new Error(result.payload.message || "Unable to load blocked dates."); }
            renderBlackouts(result.payload.blackouts || []);
            setBlackoutStatus("");
          })
          .catch(function (error) { setBlackoutStatus(error.message, true); });
      }

      function removeBlackout(blackout) {
        if (!window.confirm("Remove the blocked period " + blackout.fromDate + " - " + blackout.toDate + "?")) {
          return;
        }

        setBlackoutStatus("Removing...");
        fetch("/api/backoffice/availability?id=" + encodeURIComponent(blackout.id), {
          method: "DELETE",
          credentials: "same-origin",
          headers: { Accept: "application/json" }
        })
          .then(readApiResponse)
          .then(function (result) {
            if (!result.ok) { throw new Error(result.payload.message || "Unable to remove blocked dates."); }
            setBlackoutStatus("Blocked dates removed.");
            loadBlackouts();
          })
          .catch(function (error) { setBlackoutStatus(error.message, true); });
      }

      blackoutForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!blackoutFrom.value || !blackoutTo.value) {
          setBlackoutStatus("Select both start and end dates.", true);
          return;
        }
        if (blackoutFrom.value > blackoutTo.value) {
          setBlackoutStatus("The end date must be on or after the start date.", true);
          return;
        }

        var submitButton = blackoutForm.querySelector("button[type=submit]");
        submitButton.disabled = true;
        setBlackoutStatus("Saving...");
        fetch("/api/backoffice/availability", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ fromDate: blackoutFrom.value, toDate: blackoutTo.value, reason: blackoutReason.value })
        })
          .then(readApiResponse)
          .then(function (result) {
            if (!result.ok) { throw new Error(result.payload.message || "Unable to block dates."); }
            blackoutForm.reset();
            setBlackoutStatus("Rental dates blocked.");
            loadBlackouts();
          })
          .catch(function (error) { setBlackoutStatus(error.message, true); })
          .then(function () { submitButton.disabled = false; });
      });

      function loadReservations() {
        var query = new URLSearchParams();
        if (statusFilter.value) { query.set("status", statusFilter.value); }
        if (activeOnly) { query.set("active", "true"); }
        setStatus("Loading...");
        fetch("/api/backoffice/reservations?" + query.toString(), { credentials: "same-origin", headers: { Accept: "application/json" } })
          .then(readApiResponse)
          .then(function (result) {
            if (!result.ok) { throw new Error(result.payload.message || "Unable to load reservations."); }
            render(result.payload.reservations || []);
            setStatus("");
          })
          .catch(function (error) { setStatus(error.message, true); });
      }

      function postAction(payload, successMessage) {
        fetch("/api/backoffice/reservations", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(payload) })
          .then(readApiResponse)
          .then(function (result) { if (!result.ok) { throw new Error(result.payload.message || "Operation failed."); } setStatus(successMessage); loadReservations(); })
          .catch(function (error) { setStatus(error.message, true); });
      }

      function collectReservation(reservation) {
        var expectedReturnAt = window.prompt("Expected return (ISO date/time)", reservation.toDate + "T18:00:00+02:00");
        if (expectedReturnAt) { postAction({ action: "collect", reservationId: reservation.id, expectedReturnAt: expectedReturnAt }, "Reservation collected."); }
      }

      function completeReservation(reservation) {
        if (window.confirm("Mark all pads returned for this reservation?")) { postAction({ action: "complete", reservationId: reservation.id }, "Reservation completed."); }
      }

      activeFilter.addEventListener("click", function () {
        activeOnly = !activeOnly;
        activeFilter.setAttribute("aria-pressed", String(activeOnly));
        loadReservations();
      });
      document.getElementById("refreshButton").addEventListener("click", loadReservations);
      document.getElementById("housekeepingButton").addEventListener("click", function () {
        fetch("/api/backoffice/housekeeping", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({}) })
          .then(readApiResponse)
          .then(function (result) { if (!result.ok) { throw new Error(result.payload.message || "Housekeeping failed."); } setStatus("Housekeeping expired " + result.payload.expired + " reservation(s)."); loadReservations(); })
          .catch(function (error) { setStatus(error.message, true); });
      });
      statusFilter.addEventListener("change", loadReservations);
      loadReservations();
      loadBlackouts();
    })();
  </script>
</body>
</html>
