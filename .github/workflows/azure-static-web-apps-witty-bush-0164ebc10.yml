name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - development-preview
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  quality_checks:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality Checks
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Generate coverage
        run: npm run test:coverage

  runtime_compatibility:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Runtime Compatibility
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Verify pinned production package versions are published
        run: |
          test "$(npm view @azure/communication-email@1.1.0 version)" = "1.1.0"
          test "$(npm view @azure/data-tables@13.3.2 version)" = "13.3.2"
          test "$(npm view stripe@22.3.2 version)" = "22.3.2"
      - name: Install development dependencies
        run: npm ci
      - name: Verify source build and Function entrypoints
        run: npm run verify:build
      - name: Build deployable API bundle
        run: npm run build:api
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Verify production build and Function entrypoints
        run: npm run verify:build

  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [quality_checks, runtime_compatibility]
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          lfs: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Build deployable API bundle
        working-directory: api
        env:
          SKUCHA_DEPLOYMENT_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
        run: |
          npm ci
          npm run build:api
          npm run build:site
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BUSH_0164EBC10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "site-dist" # Allowlisted static site artifact
          api_location: "api-dist" # Bundled API output path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          skip_api_build: true
          production_branch: "main"
          ###### End of Repository/Build Configurations ######
      - name: Verify production canonical routes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          canonical_origin="https://www.skucha.co"
          apex_origin="https://skucha.co"
          paths=(
            "/skucha.html"
            "/privacy-policy.html"
            "/rental-terms.html"
            "/reservation-cancel.html"
            "/skucha-payment-success.html"
            "/api/site-status"
          )

          for path in "${paths[@]}"; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --output /dev/null "${canonical_origin}${path}"
            final_url="$(curl --fail --silent --show-error --location \
              --output /dev/null --write-out '%{url_effective}' "${apex_origin}${path}")"
            test "$final_url" = "${canonical_origin}${path}"
          done

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BUSH_0164EBC10 }}
          action: "close"
